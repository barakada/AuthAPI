services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: auth
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth-local
      MYSQL_ROOT_PASSWORD: root-local
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uauth -p$$MYSQL_PASSWORD auth -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://auth:auth-local@db:3306/auth
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  shell:
    profiles: [tools]
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://auth:auth-local@db:3306/auth
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "auth_service.shell"]
    stdin_open: true
    tty: true

  test-db:
    profiles: [test]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-local
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: mysql+aiomysql://root:test-local@test-db:3306/mysql
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  mysql-data:
